<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
   <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <!-- เพิ่ม DragControls และ lil-gui สำหรับปรับและลากแสง -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const abmientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(abmientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // --- ตัวแทนแสง + GUI + Mouse Drag ---
        const lightHelperMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffea00, wireframe: true })
        );
        lightHelperMesh.position.copy(directionalLight.position);
        scene.add(lightHelperMesh);

        const gui = new lil.GUI({ title: 'PBR Controller' });
        const lightFolder = gui.addFolder('Directional Light');
        lightFolder.add(directionalLight.position, 'x', -10, 10, 0.1).name('Position X').listen();
        lightFolder.add(directionalLight.position, 'y', 0, 15, 0.1).name('Position Y').listen();
        lightFolder.add(directionalLight.position, 'z', -10, 10, 0.1).name('Position Z').listen();
        lightFolder.add(directionalLight, 'intensity', 0, 10, 0.1).name('Intensity');
        lightFolder.addColor({ color: '#ffffff' }, 'color').name('Color').onChange((val) => {
            directionalLight.color.set(val);
        });

        const dragControls = new THREE.DragControls([lightHelperMesh], camera, renderer.domElement);
        dragControls.addEventListener('dragstart', () => { controls.enabled = false; });
        dragControls.addEventListener('drag', (event) => { directionalLight.position.copy(event.object.position); });
        dragControls.addEventListener('dragend', () => { controls.enabled = true; });
        // ----------------------------------------------

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/sunset_fairway_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg', t => {});
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);

        // โหลด glb
        const loader = new THREE.GLTFLoader();

        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        // --- โมเดลที่ 1: นกฮูก ---
        const modelUrl = 'https://raw.githubusercontent.com/SupawitPhumpurk/pbrOWL/main/MYOWL.glb';
        loader.load(modelUrl, (gltf) => {
            const model = gltf.scene;

            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            model.position.set(0, 0.1, 0); 
            model.scale.set(1, 1, 1);

            scene.add(model);
            console.log("โมเดลตัวที่ 1 (นกฮูก) ขึ้นแล้ว!");
        }, undefined, (error) => {
            console.error("เกิดข้อผิดพลาดในการโหลดโมเดลตัวที่ 1:", error);
        });

        // --- โมเดลที่ 2: บ้านต้นไม้ ---
        const secondModelUrl = 'https://raw.githubusercontent.com/SupawitPhumpurk/pbrOWL/main/treehouse.glb';
        loader.load(secondModelUrl, (gltf) => {
            const secondModel = gltf.scene;

            secondModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            secondModel.scale.set(0.2, 0.2, 0.2); 
            const box = new THREE.Box3().setFromObject(secondModel);
            
            secondModel.position.set(2, -box.min.y, -2.5);

            scene.add(secondModel);
            console.log("โมเดลตัวที่ 2 (บ้านต้นไม้) ขึ้นแล้ว!");
        }, undefined, (error) => {
            console.error("เกิดข้อผิดพลาดในการโหลดโมเดลตัวที่ 2:", error);
        });

   
        const flagModelUrl = 'https://raw.githubusercontent.com/SupawitPhumpurk/pbrOWL/main/onepiece.glb';
        loader.load(flagModelUrl, (gltf) => {
            const flagModel = gltf.scene;

            flagModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            flagModel.scale.set(0.1, 0.1, 0.1); 
            const box = new THREE.Box3().setFromObject(flagModel);

            flagModel.position.set(-2.5, -box.min.y, 0); 

            scene.add(flagModel);
            console.log("โมเดลตัวที่ 3 (ธง) ขึ้นแล้ว!");
        }, undefined, (error) => {
            console.error("เกิดข้อผิดพลาดในการโหลดโมเดลตัวที่ 3:", error);
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(t) {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

    </script>
</body>

</html>
