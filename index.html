<!DOCTYPE html>
<html>

<head>
    <title>Materials Owl</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
   <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <!-- DragControls และ lil-gui -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const abmientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(abmientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // --- ตัวแทนแสง + GUI + Mouse Drag ---
        const lightHelperMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffea00, wireframe: true })
        );
        lightHelperMesh.position.copy(directionalLight.position);
        scene.add(lightHelperMesh);

        const gui = new lil.GUI({ title: '⚙️ Controls' });

        const lightFolder = gui.addFolder('PBR Controller');
        lightFolder.add(directionalLight.position, 'x', -10, 10, 0.1).name('Position X').listen();
        lightFolder.add(directionalLight.position, 'y', 0, 15, 0.1).name('Position Y').listen();
        lightFolder.add(directionalLight.position, 'z', -10, 10, 0.1).name('Position Z').listen();
        lightFolder.add(directionalLight, 'intensity', 0, 10, 0.1).name('Intensity');

        const dragControls = new THREE.DragControls([lightHelperMesh], camera, renderer.domElement);
        dragControls.addEventListener('dragstart', () => { controls.enabled = false; });
        dragControls.addEventListener('drag', (event) => { directionalLight.position.copy(event.object.position); });
        dragControls.addEventListener('dragend', () => { controls.enabled = true; });
        // ----------------------------------------------


        function setupOwlGUI(model) {
            const folder = gui.addFolder('Character Material');
            const materials = [];

            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    if (Array.isArray(child.material)) {
                        materials.push(...child.material);
                    } else {
                        materials.push(child.material);
                    }
                }
            });

            if (materials.length === 0) return;

            const params = {
                color: '#' + (materials[0].color ? materials[0].color.getHexString() : 'ffffff'),
                metalness: materials[0].metalness !== undefined ? materials[0].metalness : 0,
                roughness: materials[0].roughness !== undefined ? materials[0].roughness : 0.5
            };

            folder.addColor(params, 'color').name('Base Color').onChange((val) => {
                materials.forEach(mat => {
                    if (mat.color) mat.color.set(val);
                });
            });

            folder.add(params, 'metalness', 0, 1, 0.01).name('Metallic').onChange((val) => {
                materials.forEach(mat => {
                    if ('metalness' in mat) mat.metalness = val;
                });
            });

            folder.add(params, 'roughness', 0, 1, 0.01).name('Roughness').onChange((val) => {
                materials.forEach(mat => {
                    if ('roughness' in mat) mat.roughness = val;
                });
            });
        }

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/sunset_fairway_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg', t => {});
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);

     
        function createBamboo(x, z, height = 5, radius = 0.08) {
            const bambooGroup = new THREE.Group();
            bambooGroup.position.set(x, 0, z);

            const bambooMat = new THREE.MeshStandardMaterial({ color: 0x3a5f28, roughness: 0.4 });
            const nodeMat = new THREE.MeshStandardMaterial({ color: 0x27401a, roughness: 0.6 });

            const segmentHeight = 0.6;
            const segmentsCount = Math.floor(height / segmentHeight);

            for (let i = 0; i < segmentsCount; i++) {
                const segGeo = new THREE.CylinderGeometry(radius * 0.95, radius, segmentHeight, 12);
                const segment = new THREE.Mesh(segGeo, bambooMat);
                segment.position.y = i * segmentHeight + segmentHeight / 2;
                segment.castShadow = true;
                segment.receiveShadow = true;
                bambooGroup.add(segment);

                const nodeGeo = new THREE.TorusGeometry(radius * 1.05, 0.02, 8, 12);
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                node.rotation.x = Math.PI / 2;
                node.position.y = i * segmentHeight;
                node.castShadow = true;
                bambooGroup.add(node);
            }

            scene.add(bambooGroup);
            return bambooGroup;
        }


        createBamboo(-3.5, -1.0, 5);
        createBamboo(-1.0, -1.0, 5);

        function createBambooLights() {
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const bulbMat = new THREE.MeshStandardMaterial({
                color: 0xffea9f,
                emissive: 0xffaa22,
                emissiveIntensity: 2.5,
                roughness: 0.2
            });

            const points = [
          
                new THREE.Vector3(-3.4, 1.2, -0.8),
                new THREE.Vector3(-3.6, 2.0, -1.1),
                new THREE.Vector3(-3.4, 2.8, -1.2),
                new THREE.Vector3(-3.5, 3.5, -0.9),

             
                new THREE.Vector3(-2.8, 3.0, -1.0),
                new THREE.Vector3(-2.25, 2.4, -1.0),
                new THREE.Vector3(-1.7, 3.0, -1.0),

           
                new THREE.Vector3(-1.0, 3.5, -0.9),
                new THREE.Vector3(-0.9, 2.8, -1.2),
                new THREE.Vector3(-1.1, 2.0, -1.1),
                new THREE.Vector3(-0.9, 1.2, -0.8)
            ];

            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, 80, 0.012, 6, false);
            const wireMesh = new THREE.Mesh(tubeGeo, wireMat);
            scene.add(wireMesh);

         
            const bulbCount = 30;
            const bulbGeo = new THREE.SphereGeometry(0.045, 8, 8);

            for (let i = 0; i <= bulbCount; i++) {
                const progress = i / bulbCount;
                const point = curve.getPoint(progress);

                const bulbMesh = new THREE.Mesh(bulbGeo, bulbMat);
                bulbMesh.position.copy(point);
                scene.add(bulbMesh);

                if (i % 5 === 0) {
                    const pLight = new THREE.PointLight(0xffaa44, 0.5, 2);
                    pLight.position.copy(point);
                    scene.add(pLight);
                }
            }
        }

        createBambooLights();

        // โหลด glb
        const loader = new THREE.GLTFLoader();

        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        const modelUrl = 'https://raw.githubusercontent.com/SupawitPhumpurk/pbrOWL/main/MYOWL.glb';
        loader.load(modelUrl, (gltf) => {
            const owlModel = gltf.scene;

            owlModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            owlModel.position.set(0, 0.1, 0); 
            owlModel.scale.set(1, 1, 1);

            scene.add(owlModel);
            setupOwlGUI(owlModel); 
            console.log("โมเดลตัวที่ 1 (นกฮูก) ขึ้นแล้ว!");
        }, undefined, (error) => {
            console.error("เกิดข้อผิดพลาดในการโหลดโมเดลตัวที่ 1:", error);
        });

        const secondModelUrl = 'https://raw.githubusercontent.com/SupawitPhumpurk/pbrOWL/main/treehouse.glb';
        loader.load(secondModelUrl, (gltf) => {
            const secondModel = gltf.scene;

            secondModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            secondModel.scale.set(0.25, 0.25, 0.25); 
            const box = new THREE.Box3().setFromObject(secondModel);
            
            secondModel.position.set(2, -box.min.y, -2.5);

            scene.add(secondModel);
            console.log("โมเดลตัวที่ 2 (บ้านต้นไม้) ขึ้นแล้ว!");
        }, undefined, (error) => {
            console.error("เกิดข้อผิดพลาดในการโหลดโมเดลตัวที่ 2:", error);
        });


        const flagModelUrl = 'https://raw.githubusercontent.com/SupawitPhumpurk/pbrOWL/main/onepiece.glb';
        loader.load(flagModelUrl, (gltf) => {
            const flagModel = gltf.scene;

            flagModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            flagModel.scale.set(0.1, 0.1, 0.1); 
            const box = new THREE.Box3().setFromObject(flagModel);

            flagModel.position.set(-2.5, -box.min.y, 0); 

            scene.add(flagModel);
            console.log("โมเดลตัวที่ 3 (ธง) ขึ้นแล้ว!");
        }, undefined, (error) => {
            console.error("เกิดข้อผิดพลาดในการโหลดโมเดลตัวที่ 3:", error);
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(t) {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

    </script>
</body>

</html>
