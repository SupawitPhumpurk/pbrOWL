<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
   <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <!-- DragControls และ lil-gui -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const abmientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(abmientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const lightHelperMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffea00, wireframe: true })
        );
        lightHelperMesh.position.copy(directionalLight.position);
        scene.add(lightHelperMesh);

        const gui = new lil.GUI({ title: '☀️ Light Settings' });
        const lightFolder = gui.addFolder('Directional Light');
        lightFolder.add(directionalLight.position, 'x', -10, 10, 0.1).name('Position X').listen();
        lightFolder.add(directionalLight.position, 'y', 0, 15, 0.1).name('Position Y').listen();
        lightFolder.add(directionalLight.position, 'z', -10, 10, 0.1).name('Position Z').listen();
        lightFolder.add(directionalLight, 'intensity', 0, 10, 0.1).name('Intensity');
        lightFolder.addColor({ color: '#ffffff' }, 'color').name('Color').onChange((val) => {
            directionalLight.color.set(val);
        });

        const dragControls = new THREE.DragControls([lightHelperMesh], camera, renderer.domElement);
        dragControls.addEventListener('dragstart', () => { controls.enabled = false; });
        dragControls.addEventListener('drag', (event) => { directionalLight.position.copy(event.object.position); });
        dragControls.addEventListener('dragend', () => { controls.enabled = true; });

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/sunset_fairway_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            side: THREE.DoubleSide
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);

        function createTree(x, z) {
            const treeGroup = new THREE.Group();

            const trunkGeo = new THREE.CylinderGeometry(0.15, 0.25, 1.5, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            treeGroup.add(trunk);

            const leavesGeo1 = new THREE.ConeGeometry(1, 1.8, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e6f40, roughness: 0.8 });
            const leaves1 = new THREE.Mesh(leavesGeo1, leavesMat);
            leaves1.position.y = 1.8;
            leaves1.castShadow = true;
            leaves1.receiveShadow = true;
            treeGroup.add(leaves1);

            const leavesGeo2 = new THREE.ConeGeometry(0.7, 1.5, 8);
            const leaves2 = new THREE.Mesh(leavesGeo2, leavesMat);
            leaves2.position.y = 2.4;
            leaves2.castShadow = true;
            leaves2.receiveShadow = true;
            treeGroup.add(leaves2);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        createTree(-3, -2);
        createTree(3, -2.5);

        const logGeo = new THREE.CylinderGeometry(0.25, 0.25, 2.5, 12);
        const logMat = new THREE.MeshStandardMaterial({ color: 0x4a2e12, roughness: 0.85 });
        const log = new THREE.Mesh(logGeo, logMat);
        log.rotation.z = Math.PI / 2;
        log.rotation.y = Math.PI / 6;
        log.position.set(-1.5, 0.25, 1.5);
        log.castShadow = true;
        log.receiveShadow = true;
        scene.add(log);

        const birdhouseGroup = new THREE.Group();

        const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 2, 8);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x6e4727 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.y = 1;
        pole.castShadow = true;
        birdhouseGroup.add(pole);

        const houseGeo = new THREE.BoxGeometry(0.8, 0.9, 0.8);
        const houseMat = new THREE.MeshStandardMaterial({ color: 0xb57849, roughness: 0.7 });
        const house = new THREE.Mesh(houseGeo, houseMat);
        house.position.y = 2.25;
        house.castShadow = true;
        house.receiveShadow = true;
        birdhouseGroup.add(house);

        const roofGeo = new THREE.ConeGeometry(0.75, 0.6, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x7c2d18, roughness: 0.6 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 2.95;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        birdhouseGroup.add(roof);

        const holeGeo = new THREE.CircleGeometry(0.18, 16);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
        const hole = new THREE.Mesh(holeGeo, holeMat);
        hole.position.set(0, 2.3, 0.41);
        birdhouseGroup.add(hole);

        birdhouseGroup.position.set(2, 0, -0.5);
        scene.add(birdhouseGroup);

        const loader = new THREE.GLTFLoader();

        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        const modelUrl = 'https://raw.githubusercontent.com/SupawitPhumpurk/pbrOWL/main/MYOWL.glb';

        loader.load(modelUrl, (gltf) => {
            const model = gltf.scene;

            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            model.position.set(0, 0.1, 0);
            model.scale.set(1, 1, 1);

            scene.add(model);
            console.log("โมเดลขึ้นแล้ว!");
        }, undefined, (error) => {
            console.error("เกิดข้อผิดพลาดในการโหลด:", error);
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(t) {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
